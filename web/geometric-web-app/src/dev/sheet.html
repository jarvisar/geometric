<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Generator contact sheet</title>
<!--
  Dev tool: renders generators with default params plus random variants.
  Query: ?gens=id1,id2 &variants=2 &size=300 &paper=210x297 &margin=12 &rotate=30 &clip=circle
         &seed=1 &set={"param":value} (overrides for the default column)
-->
<style>
  body { font: 12px/1.3 system-ui, sans-serif; margin: 12px; background: #2a2d31; color: #ddd; }
  .row { display: flex; gap: 10px; margin-bottom: 14px; align-items: flex-start; }
  .cell { display: flex; flex-direction: column; gap: 3px; }
  .cell canvas { background: #fbfaf7; box-shadow: 0 1px 4px #0008; }
  .name { width: 120px; font-weight: 600; font-size: 13px; color: #fff; }
  .meta { color: #9aa; font-size: 11px; max-width: 300px; word-break: break-all; }
  .err { color: #ff7b7b; white-space: pre-wrap; max-width: 300px; }
</style>
<script src="../lib/core.js"></script>
<script src="../lib/noise.js"></script>
<script src="../lib/contours.js"></script>
<script src="../lib/optimize.js"></script>
<script src="../lib/pipeline.js"></script>
<script src="../lib/render.js"></script>
<script src="../lib/loader.js"></script>
</head>
<body>
<div id="out"></div>
<script>
(async function () {
    const q = new URLSearchParams(location.search);
    const onlyGens = q.get('gens') ? q.get('gens').split(',') : null;
    if (onlyGens) PG.GENERATOR_FILES = PG.GENERATOR_FILES.filter(f => onlyGens.includes(f));
    await PG.loadGenerators('../generators/');
    const variants = +(q.get('variants') || 2);
    const size = +(q.get('size') || 300);
    const [pw, ph] = (q.get('paper') || '210x297').split('x').map(Number);
    const margin = +(q.get('margin') || 12);
    const seed = +(q.get('seed') || 1);
    const set = q.get('set') ? JSON.parse(q.get('set')) : {};
    const out = document.getElementById('out');
    const gens = PG.generators.filter(g => !onlyGens || onlyGens.includes(g.id));
    const pens = ['#151515', '#d1342f', '#2456c8', '#1d8a4e', '#d99a00', '#7b3fc0'].map(c => ({ color: c, width: 0.35 }));

    for (const def of gens) {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `<div class="name">${def.name}<div class="meta">${def.id} · ${def.fit ? 'fit' : 'fill'}</div></div>`;
        out.appendChild(row);
        for (let v = 0; v <= variants; v++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            row.appendChild(cell);
            let params = Object.assign(PG.defaultParams(def), v === 0 ? set : {});
            if (v > 0) params = PG.randomParams(def, params, new PG.RNG(seed * 1000 + v));
            const S = {
                seed: seed + v, paperW: pw, paperH: ph, margin, scale: 100,
                rotate: +(q.get('rotate') || 0), clip: q.get('clip') || 'rect', frame: !!q.get('clip'),
                opt: { merge: true, mergeTol: 0.1, sort: true, simplify: true, simplifyTol: 0.02 },
            };
            try {
                const res = PG.run(def, params, S);
                const k = size / Math.max(pw, ph);
                const c = document.createElement('canvas');
                c.width = Math.round(pw * k * 2); c.height = Math.round(ph * k * 2);
                c.style.width = Math.round(pw * k) + 'px'; c.style.height = Math.round(ph * k) + 'px';
                cell.appendChild(c);
                PG.drawResult(c.getContext('2d'), res, { scale: k * 2, ox: 0, oy: 0 },
                    { paper: { w: pw, h: ph }, paperColor: '#fbfaf7', pens, minLinePx: 0.7 });
                const st = res.stats;
                const meta = document.createElement('div');
                meta.className = 'meta';
                meta.textContent = `${res.timing.generate.toFixed(0)}+${res.timing.optimize.toFixed(0)}ms · ${st.paths} paths · ${st.points} pts · ${(st.draw / 1000).toFixed(1)}m` +
                    (v > 0 ? ' · ' + JSON.stringify(params).slice(0, 160) : '');
                cell.appendChild(meta);
            } catch (e) {
                const err = document.createElement('div');
                err.className = 'err';
                err.textContent = String(e && e.stack || e);
                cell.appendChild(err);
            }
        }
    }
    document.title = 'done';
})();
</script>
</body>
</html>
