# Publishes the Plotter Geometry web app (web/geometric-web-app/src) to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'web/geometric-web-app/src/**'
      - 'web/geometric-web-app/scripts/build-worker.js'
      - 'web/geometric-web-app/scripts/build-pages.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't let overlapping deploys cancel each other mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The app is static files only; drop the developer contact sheet.
      - name: Prepare site
        run: |
          node web/geometric-web-app/scripts/build-worker.js
          node web/geometric-web-app/scripts/build-pages.js
          cp -r web/geometric-web-app/src _site
          rm -rf _site/dev
          # The app compares its build meta tag with version.json to know when a new deploy is up
          sed -i 's/<meta name="build" content="dev">/<meta name="build" content="${{ github.sha }}">/' _site/index.html
          echo '{ "build": "${{ github.sha }}" }' > _site/version.json

      # Nothing is published if these fail. They run after the build so check-generation tests the
      # worker bundle that ships. The slower scene suites (boundaries, examples, alpine) and the
      # browser smoke tests are still run locally.
      - name: Run checks
        working-directory: web/geometric-web-app
        run: |
          node scripts/check.js
          node scripts/check-exports.js
          node scripts/check-state.js
          node scripts/check-edgecases.js
          node scripts/check-generation.js
          node scripts/check-pens.js
          node scripts/check-castle.js
          node scripts/check-moonbase.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
